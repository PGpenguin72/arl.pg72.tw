<!doctype html>
<html lang="zh-Hant">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>業餘無線電 AI 題庫</title><style>
body{font-family:system-ui;max-width:960px;margin:24px auto;padding:16px;background:#f5f7fb;color:#17202a}main{background:#fff;padding:28px;border-radius:18px}button{padding:10px 14px;margin:4px;border:0;border-radius:9px;background:#166534;color:#fff;cursor:pointer}.secondary{background:#475569}.option{display:block;width:100%;text-align:left;background:#eef2f7;color:#17202a}.selected{outline:3px solid #22c55e}.number{background:#e2e8f0;color:#17202a;padding:6px 9px}.answered{background:#166534;color:white}.muted{color:#64748b}.ok{color:#166534;background:#dcfce7;padding:10px}.bad{color:#991b1b;background:#fee2e2;padding:10px}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(90px,1fr))}
</style></head><body><main><h1>業餘無線電 AI 題庫</h1><p class="muted">等級 3｜35 題／40 分鐘｜答對 25 題及格</p><section id="app">載入中...</section></main><script>
let s={mode:null,qs:[],i:0,a:{},f:{},started:''};
const $=x=>document.querySelector(x),esc=x=>String(x).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function api(u,o){return(await fetch(u,o)).json()}
async function boot(){const d=await api('/api/me');if(!d.user){$('#app').innerHTML='<button onclick="location.href=\'/api/login\'">使用 PGID 登入</button>';return}$('#app').innerHTML='<p>您好，'+esc(d.user.name||d.user.email||'考生')+'！</p><button onclick="start(\'exam\')">40 分鐘考試</button><button onclick="start(\'practice\')">刷全部題庫</button><button onclick="wrong()">錯題本與統計</button><button onclick="resetP()">重置答題狀況</button><button onclick="logout()">登出</button>'}
async function start(mode){const d=await api(mode==='exam'?'/api/exams':'/api/questions',{method:mode==='exam'?'POST':undefined});s={mode,qs:d.questions||[],i:0,a:{},f:{},started:new Date().toISOString()};render()}
function nav(){return '<div class="grid">'+s.qs.map((q,n)=>'<button class="number '+(s.a[q.id]?'answered':'')+'" onclick="jump('+n+')">'+(n+1)+'</button>').join('')+'</div>'}
function render(){const q=s.qs[s.i];if(!q){$('#app').innerHTML='目前沒有題目';return}const opts=JSON.parse(q.options_json||'[]'),chosen=s.a[q.id],f=s.f[q.id];$('#app').innerHTML='<p><b>'+(s.mode==='exam'?'考試模式':'刷題模式')+'</b>｜流水號 '+(s.i+1)+' / '+s.qs.length+'｜原題號 '+q.number+'</p>'+nav()+'<p class="muted">'+esc(q.category)+'</p><h2>'+esc(q.prompt)+'</h2>'+opts.map((x,n)=>'<button class="option '+(chosen===String(n+1)?'selected':'')+'" onclick="choose('+(n+1)+')">'+(n+1)+'. '+esc(x)+'</button>').join('')+(s.mode==='practice'&&f?'<p class="'+(f.correct?'ok':'bad')+'">'+(f.correct?'答對了！':'答錯了，正確答案是 '+f.answer+'。')+'</p>':'')+'<p><button class="secondary" onclick="move(-1)" '+(s.i?'':'disabled')+'>上一題（←）</button><button onclick="move(1)">'+(s.i===s.qs.length-1?(s.mode==='exam'?'檢查答案':'返回首頁'):'下一題（→）')+'</button></p>'+(s.mode==='exam'?'<p class="muted">已作答 '+Object.keys(s.a).length+' 題；尚未作答流水號：'+s.qs.map((x,n)=>!s.a[x.id]?n+1:null).filter(Boolean).join('、')+'</p>':'<p class="muted">答錯會留在錯題本，答對會移除。</p>')}
function jump(n){s.i=n;render()}async function choose(n){const q=s.qs[s.i];s.a[q.id]=String(n);if(s.mode==='practice')s.f[q.id]=await api('/api/check',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({question_id:q.id,answer:String(n)})});render();if(s.mode==='exam'&&s.i<s.qs.length-1)setTimeout(()=>{s.i++;render()},180)}function move(n){if(n===1&&s.i===s.qs.length-1){if(s.mode==='exam')return review();return boot()}s.i=Math.max(0,Math.min(s.qs.length-1,s.i+n));render()}
function review(){const u=s.qs.map((q,n)=>!s.a[q.id]?n+1:null).filter(Boolean);$('#app').innerHTML='<h2>你做完了嗎？</h2><p>已作答 '+Object.keys(s.a).length+' / '+s.qs.length+' 題。</p><p class="'+(u.length?'bad':'ok')+'">'+(u.length?'尚未作答流水號：'+u.join('、'):'全部題目都已作答。')+'</p>'+nav()+'<button class="secondary" onclick="render()">返回修改</button><button onclick="submit()">檢查答案並提交</button>'}
async function submit(){const reviewData=await api('/api/review',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({question_ids:s.qs.map(q=>q.id),answers:s.a})});const d=await api('/api/attempts',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({mode:'exam',question_ids:s.qs.map(q=>q.id),answers:s.a,started_at:s.started})});$('#app').innerHTML='<h2>考試完成</h2><p>得分：'+d.score+' / '+d.total+'</p><p class="'+(d.passed?'ok':'bad')+'">'+(d.passed?'恭喜，考試通過！':'尚未通過，請加強錯題。')+'</p>'+reviewData.details.map(x=>'<div><b>流水號 '+x.serial+'｜原題號 '+x.number+'</b> '+(x.correct?'✅':'❌')+'<br>你的答案：'+(x.user_answer||'未作答')+'｜正確答案：'+x.answer+'</div>').join('')+'<button onclick="boot()">返回首頁</button>'}
async function wrong(){const [d,st]=await Promise.all([api('/api/wrong-notes'),api('/api/stats')]);$('#app').innerHTML='<h2>錯題本與統計</h2><p>作答總數：'+(st.totals?.total||0)+'｜答對：'+(st.totals?.correct||0)+'｜錯誤：'+(st.totals?.wrong||0)+'</p><h3>分類統計</h3>'+(st.categories||[]).map(x=>'<p>'+esc(x.category)+'：答對 '+x.correct+'，錯 '+x.wrong+'</p>').join('')+'<h3>錯題</h3>'+(d.notes||[]).map(x=>'<article><b>'+esc(x.category)+'｜原題號 '+x.number+'</b><p>'+esc(x.prompt)+'</p><p>正確答案：'+(x.answer||'尚未載入')+'</p><button onclick="analyze(\''+x.question_id+'\',this)">生成 AI 解析</button><div></div></article>').join('')+'<button onclick="boot()">返回首頁</button>'}
async function analyze(id,btn){btn.disabled=true;const d=await api('/api/analyze',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({question_id:id})});btn.nextElementSibling.textContent=d.summary||d.error||'沒有解析結果'}async function resetP(){if(confirm('確定重置所有答題紀錄？')){await api('/api/reset-progress',{method:'POST'});alert('已重置');boot()}}async function logout(){await api('/api/logout',{method:'POST'});location.reload()}document.addEventListener('keydown',e=>{if(!s.mode)return;if(/^[1-4]$/.test(e.key))choose(+e.key);if(e.key==='ArrowLeft')move(-1);if(e.key==='ArrowRight')move(1)});boot();
</script></body></html>
