<!doctype html><html lang="zh-Hant"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>業餘無線電 AI 題庫</title><style>body{font-family:system-ui,sans-serif;max-width:900px;margin:40px auto;padding:0 20px;color:#17202a;background:#f5f7fb}main{background:white;padding:32px;border-radius:18px;box-shadow:0 8px 30px #0001}button{padding:12px 18px;border:0;border-radius:10px;background:#166534;color:white;cursor:pointer;margin:4px}button.secondary{background:#475569}.card{border:1px solid #ddd;padding:18px;margin:14px 0;border-radius:12px}.muted{color:#64748b}</style></head><body><main><h1>業餘無線電 AI 題庫</h1><p class="muted">等級 3｜35 題／40 分鐘｜答對 25 題及格</p><section id="app"><button onclick="location.href='/api/login'">使用 PGID 登入</button></section></main><script>async function boot(){const r=await fetch('/api/me'),d=await r.json();if(!d.user)return;document.querySelector('#app').innerHTML='<p>您好，'+(d.user.name||d.user.email||'考生')+'！</p><button onclick="start(\'exam\')">40 分鐘考試</button><button class="secondary" onclick="start(\'practice\')">刷全部題庫</button><button class="secondary" onclick="fetch(\'/api/logout\',{method:\'POST\'}).then(()=>location.reload())">登出</button><div id="questions"></div>'}async function start(mode){const r=await fetch('/api/questions'),d=await r.json();const n=mode==='exam'?35:d.questions.length;document.querySelector('#questions').innerHTML='<h2>'+mode+'</h2><p>已載入 '+n+' 題。完整作答介面與錯題本將接續完成。</p>'+d.questions.slice(0,Math.min(n,5)).map(q=>'<div class="card"><b>'+q.category+' #'+q.number+'</b><p>'+q.prompt+'</p></div>').join('')}boot()</script></body></html>
