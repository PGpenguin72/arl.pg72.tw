<!doctype html><html lang="zh-Hant"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>業餘無線電 AI 題庫</title><style>body{font-family:system-ui,sans-serif;max-width:900px;margin:24px auto;padding:0 16px;color:#17202a;background:#f5f7fb}main{background:#fff;padding:28px;border-radius:18px;box-shadow:0 8px 30px #0001}button{padding:11px 16px;border:0;border-radius:10px;background:#166534;color:#fff;cursor:pointer;margin:4px}.secondary{background:#475569}.option{display:block;text-align:left;width:100%;background:#f1f5f9;color:#17202a;border:2px solid transparent}.selected{border-color:#166534;background:#dcfce7}.correct{border-color:#15803d;background:#dcfce7}.wrong{border-color:#b91c1c;background:#fee2e2}.bar{display:flex;justify-content:space-between;align-items:center;gap:8px}.muted{color:#64748b}.feedback{font-weight:600;padding:12px;border-radius:10px}.ok{color:#166534;background:#dcfce7}.bad{color:#991b1b;background:#fee2e2}</style></head><body><main><h1>業餘無線電 AI 題庫</h1><p class="muted">等級 3｜35 題／40 分鐘｜答對 25 題及格</p><section id="app">載入中...</section></main><script>
let s={mode:null,qs:[],i:0,a:{},f:{},started:''};const $=x=>document.querySelector(x),e=x=>String(x).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));async function api(u,o){let r=await fetch(u,o);return r.json()}async function boot(){let d=await api('/api/me');if(!d.user){$('#app').innerHTML='<button onclick="location.href=\'/api/login\'">使用 PGID 登入</button>';return}$('#app').innerHTML='<p>您好，'+e(d.user.name||d.user.email||'考生')+'！</p><button onclick="start(\'exam\')">40 分鐘考試</button><button class="secondary" onclick="start(\'practice\')">刷全部題庫</button><button class="secondary" onclick="wrong()">錯題本</button><button class="secondary" onclick="resetP()">重置答題狀況</button><button class="secondary" onclick="logout()">登出</button>'}async function start(mode){let d=await api(mode==='exam'?'/api/exams':'/api/questions',{method:mode==='exam'?'POST':undefined});s={mode,qs:d.questions||[],i:0,a:{},f:{},started:new Date().toISOString()};render()}function render(){if(!s.qs.length){$('#app').innerHTML+='<p>目前沒有題目。</p>';return}let q=s.qs[s.i],o=JSON.parse(q.options_json||'[]'),c=s.a[q.id],f=s.f[q.id];$('#app').innerHTML='<div class="bar"><b>'+(s.mode==='exam'?'考試模式':'刷題模式')+'</b><span>'+(s.i+1)+' / '+s.qs.length+'</span></div><p class="muted">'+e(q.category)+'｜第 '+q.number+' 題</p><h2>'+e(q.prompt)+'</h2>'+o.map((x,n)=>'<button class="option '+(c===String(n+1)?'selected ':'')+(f&&(n+1===Number(f.answer)?'correct':c===String(n+1)?'wrong':''))+'" onclick="choose('+(n+1)+')">'+(n+1)+'. '+e(x)+'</button>').join('')+(s.mode==='practice'&&f?'<div class="feedback '+(f.correct?'ok':'bad')+'">'+(f.correct?'答對了！':'答錯了，正確答案是 '+f.answer+'。')+'</div>':'')+'<div class="bar"><button class="secondary" onclick="move(-1)" '+(s.i?'':'disabled')+'>上一題</button><button onclick="move(1)">'+(s.i===s.qs.length-1?'完成':'下一題')+'</button></div><p class="muted">'+(s.mode==='exam'?'考試不顯示對錯；按鍵盤 1、2、3、4 作答。':'答錯的題目會回流，答對的題目會標記。')+'</p>'}async function choose(n){let q=s.qs[s.i];s.a[q.id]=String(n);if(s.mode==='practice')s.f[q.id]=await api('/api/check',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({question_id:q.id,answer:String(n)})});render()}function move(n){if(n===1&&s.i===s.qs.length-1){if(s.mode==='exam')return submit();return boot()}s.i=Math.max(0,Math.min(s.qs.length-1,s.i+n));render()}async function submit(){let d=await api('/api/attempts',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({mode:'exam',question_ids:s.qs.map(q=>q.id),answers:s.a,started_at:s.started})});$('#app').innerHTML='<h2>考試完成</h2><p>得分：'+d.score+' / '+d.total+'</p><div class="feedback '+(d.passed?'ok':'bad')+'">'+(d.passed?'恭喜，考試通過！':'尚未通過，請加強錯題。')+'</div><button onclick="boot()">返回首頁</button>'}async function wrong(){let d=await api('/api/wrong-notes');$('#app').innerHTML='<h2>錯題本</h2><p>目前錯題：'+(d.notes?.length||0)+' 題</p>'+(d.notes||[]).map(x=>'<div><b>'+e(x.category)+' #'+x.number+'</b><p>'+e(x.prompt)+'</p></div>').join('')+'<button onclick="boot()">返回首頁</button>'}async function resetP(){if(confirm('確定要重置所有答題紀錄嗎？')){await api('/api/reset-progress',{method:'POST'});alert('已重置');boot()}}async function logout(){await api('/api/logout',{method:'POST'});location.reload()}document.addEventListener('keydown',x=>{if(s.mode&&/^[1-4]$/.test(x.key))choose(Number(x.key))});boot();</script></body></html>
